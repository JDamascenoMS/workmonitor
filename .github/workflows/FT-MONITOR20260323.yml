name: Build and deploy .NET Core application to Web App FT-MONITOR20260323
on:
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      deploy_dashboard:
        description: Explicitly deploy the dashboard after build and tests
        required: false
        default: false
        type: boolean
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: FT-MONITOR20260323
  AZURE_WEBAPP_PACKAGE_PATH: FT-MONITOR/publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.404
  SOLUTION: FT-MONITOR.sln
  WEB_PROJECT: FT-MONITOR/FT-MONITOR.csproj
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.SOLUTION }}"
    - name: Build
      run: dotnet build "${{ env.SOLUTION }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      env:
        WorkMonitor__Authentication__TenantId: 72f988bf-86f1-41af-91ab-2d7cd011db47
        WorkMonitor__Authentication__LoginHint: alice@example.com
        AzureAd__TenantId: 72f988bf-86f1-41af-91ab-2d7cd011db47
        AzureAd__ClientId: 33333333-3333-3333-3333-333333333333
        AzureOpenAI__Endpoint: https://unused-openai.example/
        AzureOpenAI__DeploymentName: unused-test-deployment
        AzureOpenAI__ApiKey: test-only-unused-api-key
      run: dotnet test "${{ env.SOLUTION }}" --configuration ${{ env.CONFIGURATION }} --no-build
    - name: Publish
      run: dotnet publish "${{ env.WEB_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_dashboard }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.FT_MONITOR20260323_CLIENT_ID_CB02 }}
        tenant-id: ${{ vars.FT_MONITOR20260323_TENANT_ID_26DD }}
        subscription-id: ${{ vars.FT_MONITOR20260323_SUBSCRIPTION_ID_26DD }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
